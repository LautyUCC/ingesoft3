name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Tests y umbral de cobertura
        run: npm run test:check-coverage
        working-directory: backend
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage-report
          path: backend/coverage/
          if-no-files-found: ignore
      - uses: docker/setup-buildx-action@v3
      - name: Verificar imagen de backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          build-args: COMMIT_SHA=${{ github.sha }}
          push: false
          tags: ghcr.io/lautyucc/photomatch-backend:sha-${{ github.sha }}
          outputs: type=docker,dest=/tmp/photomatch-backend.tar
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: backend-image
          path: /tmp/photomatch-backend.tar
          retention-days: 1

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir etapa de tests del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test
      - name: Tests y umbral de cobertura del frontend
        run: |
          mkdir -p frontend-coverage
          docker run --rm --user "$(id -u):$(id -g)" -e COVERAGE_DIR=/salida \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci
      - name: Resumen de cobertura del frontend
        run: |
          test -f frontend-coverage/coverage-summary.json
          node -e "const t=require('./frontend-coverage/coverage-summary.json').total; if(!t.lines.total) process.exit(1); console.log('### Cobertura frontend\\n| Métrica | Porcentaje |\\n|---|---:|'); for(const k of ['lines','branches','functions','statements']) console.log('| '+k+' | '+t[k].pct+'% |')" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage-report
          path: frontend-coverage/
          if-no-files-found: ignore
      - name: Verificar imagen de frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: ghcr.io/lautyucc/photomatch-frontend:sha-${{ github.sha }}
          outputs: type=docker,dest=/tmp/photomatch-frontend.tar
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: frontend-image
          path: /tmp/photomatch-frontend.tar
          retention-days: 1

  publish:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: backend-image
          path: /tmp
      - uses: actions/download-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: frontend-image
          path: /tmp
      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar ambas imágenes verificadas
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker load -i /tmp/photomatch-backend.tar
          docker load -i /tmp/photomatch-frontend.tar
          docker push "ghcr.io/lautyucc/photomatch-backend:sha-$COMMIT_SHA"
          docker push "ghcr.io/lautyucc/photomatch-frontend:sha-$COMMIT_SHA"

  deploy-qa:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: [self-hosted, photomatch]
    environment: qa
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar imágenes verificadas en QA
        env:
          DEPLOY_ENV: qa
          APP_PORT: '3001'
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_BROWSER_DSN: ${{ secrets.SENTRY_BROWSER_DSN }}
          COMMIT_SHA: ${{ github.sha }}
        run: bash scripts/deploy-local.sh
      - name: Smoke QA
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: bash scripts/smoke.sh

  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: e2e
    runs-on: [self-hosted, photomatch]
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Promover las mismas imágenes a producción
        env:
          DEPLOY_ENV: prod
          APP_PORT: '3002'
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_BROWSER_DSN: ${{ secrets.SENTRY_BROWSER_DSN }}
          COMMIT_SHA: ${{ github.sha }}
        run: bash scripts/deploy-local.sh
      - name: Smoke producción
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: bash scripts/smoke.sh

  integracion:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-qa
    runs-on: [self-hosted, photomatch]
    environment: qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - name: Integración contra QA y PostgreSQL real
        working-directory: frontend
        env:
          API_BASE_URL: ${{ vars.FRONTEND_URL }}
          E2E_EMAIL: ${{ vars.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npm run test:integration
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-integracion
          path: frontend/playwright-report/
          if-no-files-found: ignore

  e2e:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: integracion
    runs-on: [self-hosted, photomatch]
    environment: qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install chromium
        working-directory: frontend
      - name: Flujos E2E con navegador contra QA
        working-directory: frontend
        env:
          E2E_BASE_URL: ${{ vars.FRONTEND_URL }}
          E2E_EMAIL: ${{ vars.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report/
          if-no-files-found: ignore
